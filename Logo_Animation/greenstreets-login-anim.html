<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenstreets Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#08111f;
    --card-line:rgba(120,150,210,.22);
    --hdr-a:#163746; --hdr-b:#1c2b52;
    --form:#0b1628;
    --field:#121d30; --field-line:rgba(255,255,255,.12); --field-focus:#4ebb81;
    --tx:#ffffff; --tx2:#8d9bb2;
    --gs-a:#93e4b4; --gs-b:#3ecf8e; --gs-c:#46b3a8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);
    background:radial-gradient(90% 70% at 50% 0%,#0f1d33 0%,var(--page) 70%);
    display:flex;align-items:center;justify-content:center;padding:24px 16px}

  .card{width:100%;max-width:540px;border:1px solid var(--card-line);border-radius:22px;overflow:hidden;
    background:var(--form);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}

  /* ── logo zone: the animation lives here ───────────────────────── */
  .hdr{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:26px 24px 24px;min-height:244px;
    background:radial-gradient(70% 90% at 15% 0%,rgba(73,174,122,.16),transparent 60%),
               linear-gradient(115deg,var(--hdr-a),var(--hdr-b));
    border-bottom:1px solid rgba(255,255,255,.08)}
  #logo{width:150px;aspect-ratio:1/1;cursor:pointer}
  .tagline{font-size:13px;font-weight:500;letter-spacing:.1px;opacity:0;transform:translateY(6px);
    transition:opacity .5s ease,transform .5s ease}
  .tagline.in{opacity:1;transform:none}

  /* ── form zone ─────────────────────────────────────────────────── */
  .form{padding:34px 40px 40px;display:flex;flex-direction:column}
  h1{margin:0;text-align:center;font-size:26px;font-weight:600;letter-spacing:-.2px}
  .sub{margin:8px 0 34px;text-align:center;font-size:15px;color:var(--tx2)}
  .fi{width:100%;height:52px;margin-bottom:16px;padding:0 18px;border-radius:12px;font:inherit;font-size:17px;
    color:var(--tx);background:var(--field);border:1px solid var(--field-line);outline:none;transition:border-color .2s,box-shadow .2s}
  .fi::placeholder{color:#7f8da5}
  .fi:focus{border-color:var(--field-focus);box-shadow:0 0 0 3px rgba(78,187,129,.18)}
  .btn{position:relative;overflow:hidden;margin-top:8px;height:58px;border:0;border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:18px;font-weight:600;color:#0c1b1f;
    background:linear-gradient(90deg,var(--gs-a),var(--gs-b) 62%,var(--gs-c));
    box-shadow:0 12px 30px -10px rgba(62,207,142,.55);transition:transform .12s,filter .2s}
  .btn::before{content:'';position:absolute;left:-10%;right:-10%;top:-140%;height:220%;border-radius:50%;
    border-bottom:2px solid rgba(255,255,255,.35);background:radial-gradient(60% 50% at 50% 100%,rgba(255,255,255,.18),transparent)}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:scale(.98)}
  .btn svg,.btn span{position:relative}
  .foot{margin:26px auto 0;max-width:330px;text-align:center;font-size:14.5px;line-height:1.4;color:var(--tx2)}

  .replay{position:fixed;right:16px;bottom:16px;font:inherit;font-size:12px;color:var(--tx2);background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;cursor:pointer}
  .replay:hover{color:var(--tx)}

  @media (max-width:480px){
    .form{padding:28px 22px 30px}
    .hdr{min-height:210px}
    #logo{width:124px}
  }
</style>
</head>
<body>

<main class="card">
  <div class="hdr">
    <div id="logo" title="Replay animation"></div>
    <div class="tagline" id="tagline">Global EPR Compliance Specialists</div>
  </div>

  <form class="form" onsubmit="return false">
    <h1>Sign in</h1>
    <p class="sub">Enter your email to sign in to GreenStreets</p>
    <input class="fi" type="email" placeholder="you@luntaipackaging.com" autocomplete="username" aria-label="Email">
    <input class="fi" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <button class="btn" type="submit">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
      <span>Sign in</span>
    </button>
    <p class="foot">Supporting compliance with EU Packaging Regulation 2025/40</p>
  </form>
</main>

<button class="replay" id="replay" type="button">↻ Replay logo</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/DrawSVGPlugin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/MotionPathPlugin.min.js"></script>
<script src="greenstreets-logo-anim.js?v=2"></script>
<script>
  var tagline = document.getElementById('tagline');
  var anim = GSLogoAnim.mount(document.getElementById('logo'), {
    delay: 0.3,
    respectReducedMotion: false   // showcase page: always play. Production keeps the default (true).
  });

  // The tagline rises in as the swooshes finish drawing (timeline second 3.2 ≈ 2.1 s real time).
  if (anim.timeline) anim.timeline.call(function () { tagline.classList.add('in'); }, null, 3.2);
  else tagline.classList.add('in');

  function replay() { tagline.classList.remove('in'); anim.replay(); }
  document.getElementById('logo').addEventListener('click', replay);
  document.getElementById('replay').addEventListener('click', replay);
</script>
</body>
</html>
