th d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></symbol><symbol id="gsi-15" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol><symbol id="gsi-16" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol><symbol id="gsi-17" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol></defs></svg>

<div class="screen on" id="sa_importusers">
  <div class="app-body">
    <div class="sidebar" data-active="s7"></div>
    <div class="main">
      <div class="breadcrumb"><a class="bc-link" onclick="go('s7')">Users</a><span class="bc-sep">›</span><span class="bc-cur">Import</span></div>
      <div class="pg-hdr-bar">
        <div><div class="pg-title">Import users <span class="pg-badge" title="Super Admin console" aria-label="Super Admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg></span></div><div class="pg-sub">Bulk-invite a retailer's team from a spreadsheet, or add one by hand</div></div>
      </div>

      <div class="grp">
        <div class="grp-hdr">Import from CSV / XLSX</div>
        <div class="grp-body">
          <div style="display:flex;align-items:center;gap:0;margin-bottom:18px;position:relative"><div style="position:absolute;top:13px;left:0;right:0;height:1px;background:var(--bw)"></div><div class="step is-current"><div class="step-dot">1</div><div class="step-lbl">Upload</div></div><div class="step" title="Upload a file first"><div class="step-dot">2</div><div class="step-lbl">Validate</div></div><div class="step" title="Upload a file first"><div class="step-dot">3</div><div class="step-lbl">Confirm</div></div></div>
          <div class="fgrp" style="max-width:340px;margin-bottom:14px"><label class="flbl">Import into retailer <span class="req">*</span></label><select class="fi fi-select cs-searchable" id="sa-imp-retailer"><option value="" selected disabled>Select retailer…</option><option value="Primark Stores Ltd">Primark Stores Ltd</option><option value="H&amp;M Group">H&amp;M Group</option><option value="Next plc">Next plc</option><option value="Zara / Inditex">Zara / Inditex</option><option value="M&amp;S Group">M&amp;S Group</option><option value="Dunnes Stores">Dunnes Stores</option><option value="New Look">New Look</option></select></div>
          <div class="vu-drop">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4ebb81" stroke-width="1.5" style="margin-bottom:10px"><use href="#gsi-3"/></svg>
            <div style="font-size:13px;color:var(--tw2);margin-bottom:4px">Drop your user list CSV or XLSX here</div>
            <div style="font-size:11px;color:var(--tw3);margin-bottom:14px">Columns: full_name, email, role</div>
            <div style="display:flex;gap:8px;justify-content:center">
              <button class="btn-p" id="sa-user-browse" onclick="saImportUsersBrowse()" style="height:36px;padding:0 16px">Browse files</button>
              <button class="btn-g" onclick="saImportUsersTemplate()" style="height:36px;padding:0 14px;font-size:11px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-4"/></svg> Download template</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin:16px 0">
            <div style="flex:1;height:1px;background:var(--bw)"></div><span style="font-size:11px;color:var(--tw3)">or</span><div style="flex:1;height:1px;background:var(--bw)"></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <div style="font-size:12px;color:var(--tw2)">Prefer to add one at a time?</div>
            <button class="btn-g" onclick="go('s7')" style="height:34px;padding:0 15px;display:inline-flex;align-items:center;gap:6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-8"/></svg>Invite a member manually</button>
          </div>
          <div class="faction" style="justify-content:flex-start">
            <button class="btn-g" onclick="go('s7')" style="height:36px;padding:0 16px;display:inline-flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-9"/></svg>Return to users</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
