<!-- ═══ ADD RETAILER — STEP 1: COMPANY ═══ -->
<div class="screen on" id="p1">
  <div class="app-body">
    <div class="sidebar" data-active="s2"></div>
    <div class="main">
      <div class="breadcrumb"><a class="bc-link" onclick="go('s2')">Retailers</a><span class="bc-sep">›</span><span class="bc-cur">Add retailer</span></div>
      <div class="ob-bar">
        <div class="ob-bar-title">Onboarding progress</div>
        <div class="ob-steps">
          <div class="ob-step"><div class="ob-dot curr">1</div><div class="ob-lbl curr">Company</div></div>
          <div class="ob-step"><div class="ob-dot">2</div><div class="ob-lbl">Jurisdiction</div></div>
          <div class="ob-step"><div class="ob-dot">3</div><div class="ob-lbl">Admin user</div></div>
          <div class="ob-step"><div class="ob-dot">4</div><div class="ob-lbl">Confirm</div></div>
        </div>
      </div>
      <div class="grp">
        <div class="grp-hdr">Step 1 — Company details</div>
        <div class="grp-body">
          <div class="fg2">
            <div class="fgrp"><label class="flbl">Company name <span class="req">*</span></label><input class="fi" value="Primark Stores Ltd" readonly></div>
            <div class="fgrp"><label class="flbl">Registered country <span class="req">*</span></label><select class="fi"><option>Ireland</option></select></div>
          </div>
          <div class="fg2">
            <div class="fgrp"><label class="flbl">Company registration</label><input class="fi" value="IE-123456" readonly></div>
            <div class="fgrp"><label class="flbl">VAT number</label><input class="fi" value="IE1234567T" readonly></div>
          </div>
          <div class="fgrp"><label class="flbl">Tenant slug</label><input class="fi" value="primark" readonly><div class="fhint" style="color:var(--gs-l)">primark.greenstreets.ie</div></div>
          <div class="faction">
            <button class="btn-g" onclick="go('s2')">Cancel</button>
            <button class="btn-p" onclick="go('p2')">Next: Jurisdiction <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-10"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>
