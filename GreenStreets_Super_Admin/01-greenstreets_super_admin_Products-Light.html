<!-- ═══ PRODUCTS (LIGHT) ═══ -->
<div class="screen on" id="s11">
  <div class="app-body">
    <div class="sidebar" data-active="s11"></div>
    <div class="main">
      <div class="pg-hdr-bar">
        <div><div class="pg-title">Products <span class="pg-badge" title="Super Admin console" aria-label="Super Admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg></span></div><div class="pg-sub">Product catalogue and packaging coverage at a glance</div></div>
        <div class="pg-actions hdr-stat-row">
          <div class="stat-mini"><div class="stat-icon i-tl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#gsi-16"/></svg></div><div><div class="stat-lbl">Total products</div><div class="stat-val">64</div></div></div>
          <div class="stat-mini"><div class="stat-icon i-gs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#gsi-1"/></svg></div><div><div class="stat-lbl">Packaging complete</div><div class="stat-val" style="color:var(--gs-l)">16</div></div></div>
          <div class="stat-mini"><div class="stat-icon i-am"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#gsi-3"/></svg></div><div><div class="stat-lbl">Awaiting packaging data</div><div class="stat-val" style="color:var(--amber)">48</div></div></div>
        </div>
      </div>
      <div class="grp">
        <div class="grp-hdr"><span class="lt-cardtitle">Product catalogue</span>
          <button class="btn-g-sm"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-5"/></svg>Import</button>
        </div>
        <div class="grp-body">
          <div class="filter-toolbar">
            <div class="search-wrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-6"/></svg><input class="fi fi-search" placeholder="Search SKU or description..." oninput="ptSearch('s11', this.value)"></div>
            <select class="fi fi-select" onchange="ptFilter('s11','cat', this.value)">
              <option value="all">All categories</option><option>Tops</option><option>Bottoms</option><option>Dresses</option><option>Outerwear</option><option>Footwear</option><option>Accessories</option>
            </select>
            <select class="fi fi-select" onchange="ptFilter('s11','supplier', this.value)">
              <option value="all">All suppliers</option><option>Indotex Manufacturing</option><option>Luntai Packaging Co.</option><option>EcoPack GmbH</option>
            </select>
            <select class="fi fi-select" onchange="ptFilter('s11','status', this.value)">
              <option value="all">All statuses</option><option>Complete</option><option>Incomplete</option><option>Pending</option>
            </select>
          </div>
          <div class="tbl-wrap"><table class="tbl" id="pt-table-s11">
            <colgroup><col width="3%"><col width="13%"><col width="13%"><col width="8%"><col width="13%"><col width="13%"><col width="11%"><col width="9%"><col width="13%"><col width="4%"></colgroup>
            <thead><tr>
              <th style="text-align:center;padding-left:0;padding-right:0"><input type="checkbox" id="saprod-selectall" aria-label="Select all products" title="Select all" onclick="saProdToggleAll(this)"></th>
              <th data-col="sku" onclick="ptSort('s11','sku')" style="cursor:pointer;user-select:none">SKU <span class="sort-arrow" style="opacity:.4;font-size:9px">↕</span></th>
              <th>Description</th>
              <th data-col="cat" onclick="ptSort('s11','cat')" style="cursor:pointer;user-select:none">Category <span class="sort-arrow" style="opacity:.4;font-size:9px">↕</span></th>
              <th data-col="retailer" onclick="ptSort('s11','retailer')" style="cursor:pointer;user-select:none">Retailer <span class="sort-arrow" style="opacity:.4;font-size:9px">↕</span></th>
              <th>Supplier</th>
              <th>Packaging</th>
              <th data-col="status" onclick="ptSort('s11','status')" style="cursor:pointer;user-select:none">Status <span class="sort-arrow" style="opacity:.4;font-size:9px">↕</span></th>
              <th>Actions</th>
              <th></th>
            </tr></thead>
            <tbody id="pt-tbody-s11"></tbody></table></div>
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:var(--sp-3)">
            <div id="pt-count-s11" class="tbl-muted" style="font-size:11px"></div>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:6px">
                <span style="font-size:11px;color:var(--tw3)">Rows per page</span>
                <select class="fi fi-select" style="height:30px;font-size:11px;padding:0 8px;width:auto" onchange="ptPageSize('s11', this.value)">
                  <option value="20">20</option><option value="50">50</option><option value="100">100</option>
                </select>
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <span style="font-size:11px;color:var(--tw3)">Go to</span>
                <select class="fi fi-select" id="pt-jump-s11" title="Jump to page" style="height:30px;font-size:11px;padding:0 8px;width:auto" onchange="ptJump('s11',this.value)"></select>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <button class="btn-g-sm" id="pt-prev-s11" onclick="ptGoPage('s11',-1)">‹ Prev</button>
                <span id="pt-pageinfo-s11" style="font-size:11px;color:var(--tw2);white-space:nowrap"></span>
                <button class="btn-g-sm" id="pt-next-s11" onclick="ptGoPage('s11',1)">Next ›</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
