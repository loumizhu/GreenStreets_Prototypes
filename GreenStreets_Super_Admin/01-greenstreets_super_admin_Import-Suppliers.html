<div class="screen on" id="sa_importsuppliers">
  <div class="app-body">
    <div class="sidebar" data-active="s3"></div>
    <div class="main">
      <div class="breadcrumb"><a class="bc-link" onclick="go('s3')">Suppliers</a><span class="bc-sep">›</span><span class="bc-cur">Import</span></div>
      <div class="pg-hdr-bar">
        <div><div class="pg-title">Import suppliers <span class="pg-badge" title="Super Admin console" aria-label="Super Admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg></span></div><div class="pg-sub">Bulk-import your supplier list from a spreadsheet, or add one by hand</div></div>
      </div>

      <div class="grp">
        <div class="grp-hdr">Import from CSV / XLSX</div>
        <div class="grp-body">
          <div style="display:flex;align-items:center;gap:0;margin-bottom:18px;position:relative">
            <div style="position:absolute;top:13px;left:0;right:0;height:1px;background:var(--bw)"></div>
            <div class="step is-current"><div class="step-dot">1</div><div class="step-lbl">Upload</div></div>
            <div class="step" title="Upload a file first"><div class="step-dot">2</div><div class="step-lbl">Validate</div></div>
            <div class="step" title="Upload a file first"><div class="step-dot">3</div><div class="step-lbl">Confirm</div></div>
          </div>
          <div class="fgrp" style="margin-bottom:14px;max-width:340px"><label class="flbl">Assign imported suppliers to retailer <span class="req">*</span></label><select class="fi"><option>Primark Stores Ltd</option><option>H&amp;M Group</option><option>Next plc</option><option>Zara / Inditex</option><option>M&amp;S Group</option><option>Dunnes Stores</option><option>New Look</option></select></div>
          <div style="border:1.5px dashed rgba(78,187,129,.35);border-radius:10px;padding:34px 28px;text-align:center;margin-bottom:14px;background:rgba(78,187,129,.04)">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4ebb81" stroke-width="1.5" style="margin-bottom:10px"><use href="#gsi-14"/></svg>
            <div style="font-size:13px;color:var(--tw2);margin-bottom:4px">Drop your supplier CSV or XLSX here</div>
            <div style="font-size:11px;color:var(--tw3);margin-bottom:14px">Columns: supplier_name, email, region, tier</div>
            <div style="display:flex;gap:8px;justify-content:center">
              <button class="btn-p" onclick="go('sa_validate_sup')" style="height:36px;padding:0 16px">Browse files</button>
              <button class="btn-g" style="height:36px;padding:0 14px;font-size:11px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download template</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin:16px 0">
            <div style="flex:1;height:1px;background:var(--bw)"></div><span style="font-size:11px;color:var(--tw3)">or</span><div style="flex:1;height:1px;background:var(--bw)"></div>
          </div>
          <div class="faction" style="justify-content:space-between;align-items:center">
            <button class="btn-g" onclick="go('s3')" style="height:36px;padding:0 16px;display:inline-flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-10"/></svg>Return to suppliers</button>
            <button class="btn-g" onclick="go('s14')" style="height:36px;padding:0 16px;display:inline-flex;align-items:center;gap:6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-16"/></svg>Add a supplier manually</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/super-admin.js?v=32"></script>

</html>
