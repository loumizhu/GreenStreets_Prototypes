<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GreenStreets Super Admin · Login (Light)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/greenstreets-theme.css?v=40">
<!-- light theme layer — loaded AFTER the shared glass theme so it wins by source order -->
<link rel="stylesheet" href="css/greenstreets-light.css?v=6">
</head>
<body class="lt">
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs><symbol id="gsi-0" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol><symbol id="gsi-5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol></defs></svg>

<div class="lt-modebar lt-modebar-login">🎨 <b>Light theme preview</b> <a data-nolight href="01-greenstreets_super_admin_Login.html">← Back to standard (dark) view</a></div>

<!-- ═══ LOGIN (LIGHT) ═══ -->
<div class="screen on" id="s1">
  <div class="login-wrap">
    <div class="login-card" id="loginCard">
      <div class="login-logo-zone">
        <div class="zone-spotlight"></div>
        <div class="login-eyebrow">Secure access</div>
        <img class="gs-logo-img" src="../img/GreenStreet-Light-Theme.png" alt="Greenstreets">
      </div>
      <div class="login-form-zone">
        <div class="zone-spotlight"></div>
        <div class="login-title">Greenstreet Admin</div>
        <div class="login-sub">Sign in to manage retailers &amp; suppliers across the network.</div>

        <div class="fgrp-login fi-icon-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z" opacity="0"/><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
          <input class="fi" type="email" placeholder="name@greenstreets.ie">
        </div>
        <div class="fgrp-login fi-icon-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input class="fi" type="password" placeholder="Password">
        </div>
        <input class="fi mfa-fi" type="text" placeholder="000 000" style="margin-bottom:0">

        <div class="mfa-hint">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M8 7v4M8 5.5v.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>MFA required for this account</span>
        </div>

        <button class="btn-p" onclick="go('s2')" style="width:100%">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
          Access dashboard
        </button>
        <a class="forgot" onclick="void(0)">Forgot password?</a>
      </div>
    </div>
  </div>
</div>

<script src="js/super-admin.js?v=13"></script>
<script src="js/greenstreets-theme.js?v=32"></script>
<script src="js/greenstreets-light.js?v=1"></script>
</body>
</html>
