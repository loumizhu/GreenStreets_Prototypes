<!-- ═══ ADD SUPPLIER ═══ -->
<div class="screen on" id="s14">
  <div class="app-body">
    <div class="sidebar" data-active="s3"></div>
    <div class="main">
      <div class="pg-hdr-bar">
        <div>
          <div class="pg-title">Add supplier <span class="pg-badge" title="Super Admin console" aria-label="Super Admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg></span></div>
          <div class="pg-sub">Create a supplier account and invite their contacts</div>
        </div>
      </div>
      <div class="grids">
        <div class="grp">
          <div class="grp-hdr">Supplier details</div>
          <div class="grp-body">
            <div class="fg2">
              <div class="fgrp"><label class="flbl">Supplier name <span class="req">*</span></label><input class="fi" placeholder="e.g. Indotex Manufacturing"></div>
              <div class="fgrp"><label class="flbl">Assigned retailer <span class="req">*</span></label><select class="fi"><option>Primark</option><option>Aldi</option><option>Tesco</option><option>Dunnes Stores</option></select></div>
            </div>
            <div class="fg2">
              <div class="fgrp"><label class="flbl">Registered country <span class="req">*</span></label><select class="fi"><option>Ireland</option><option>United Kingdom</option><option>Germany</option><option>China</option><option>India</option><option>Bangladesh</option><option>Turkey</option></select></div>
              <div class="fgrp"><label class="flbl">Region</label><select class="fi"><option>EU</option><option>UK</option><option>APAC</option><option>Americas</option></select></div>
            </div>
            <div class="fg2">
              <div class="fgrp"><label class="flbl">Company registration</label><input class="fi" placeholder="Registration number"></div>
              <div class="fgrp"><label class="flbl">VAT number</label><input class="fi" placeholder="VAT number"></div>
            </div>
            <div class="fg2">
              <div class="fgrp"><label class="flbl">Supplier tier</label><select class="fi"><option>Tier 1</option><option>Tier 2</option><option>Tier 3</option></select></div>
              <div class="fgrp"><label class="flbl">Website</label><input class="fi" placeholder="https://"></div>
            </div>
            <div class="fgrp" style="margin-bottom:0"><label class="flbl">Notes</label><textarea class="fi" rows="2" placeholder="Optional internal notes about this supplier"></textarea></div>
          </div>
        </div>
        <div class="grp">
          <div class="grp-hdr">
            Contacts
            <button class="btn-g-sm" onclick="addSupContact()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-4"/></svg>Add contact</button>
          </div>
          <div class="grp-body">
            <div class="fhint" style="margin-bottom:10px">Add one or more people at this supplier. The primary contact receives the invitation.</div>
            <div id="sup-contacts"></div>
          </div>
        </div>
        <div class="grp" style="grid-column:1/-1">
          <div class="grp-hdr">Notification</div>
          <div class="grp-body">
            <div class="tgl-row" style="border-bottom:none">
              <div class="tgl-info">Send invitation email<small>Email the primary contact a secure link to complete their packaging data</small></div>
              <div class="tgl on" id="sup-notify" onclick="this.classList.toggle('on')"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="faction">
        <button class="btn-g" onclick="go('s3')">Cancel</button>
        <button class="btn-p" onclick="go('s3')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-12"/></svg>Create supplier</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var seq = 0;
  window.addSupContact = function(){
    var wrap = document.getElementById('sup-contacts');
    if(!wrap) return;
    seq++;
    var first = wrap.children.length === 0;
    var row = document.createElement('div');
    row.className = 'sup-contact';
    row.style.cssText = 'background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:12px;margin-bottom:10px';
    row.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
        '<div class="flbl sup-c-title" style="margin:0"></div>'+
        '<button class="btn-g-sm sup-c-remove" onclick="removeSupContact(this)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#gsi-15"/></svg>Remove</button>'+
      '</div>'+
      '<div class="fg2">'+
        '<div class="fgrp"><label class="flbl">Full name</label><input class="fi" placeholder="Contact name"></div>'+
        '<div class="fgrp"><label class="flbl">Job title</label><input class="fi" placeholder="e.g. Compliance Manager"></div>'+
      '</div>'+
      '<div class="fg2">'+
        '<div class="fgrp"><label class="flbl">Email <span class="req">*</span></label><input class="fi" type="email" placeholder="name@supplier.com"></div>'+
        '<div class="fgrp"><label class="flbl">Phone</label><input class="fi" placeholder="Optional"></div>'+
      '</div>'+
      '<div class="tgl-row" style="border-bottom:none;padding:4px 0 0">'+
        '<div class="tgl-info">Primary contact<small>Receives the invitation & reminders</small></div>'+
        '<div class="tgl sup-c-primary'+(first?' on':'')+'" onclick="setSupPrimary(this)"></div>'+
      '</div>';
    wrap.appendChild(row);
    if(window.GSEnhanceSelects) window.GSEnhanceSelects(row);
    renumberSupContacts();
  };
  window.removeSupContact = function(btn){
    var wrap = document.getElementById('sup-contacts');
    if(!wrap || wrap.children.length <= 1) return;
    var row = btn.closest('.sup-contact');
    var wasPrimary = row.querySelector('.sup-c-primary').classList.contains('on');
    row.remove();
    if(wasPrimary){
      var firstTgl = wrap.querySelector('.sup-c-primary');
      if(firstTgl) firstTgl.classList.add('on');
    }
    renumberSupContacts();
  };
  window.setSupPrimary = function(tgl){
    document.querySelectorAll('#sup-contacts .sup-c-primary').forEach(function(t){ t.classList.remove('on'); });
    tgl.classList.add('on');
  };
  function renumberSupContacts(){
    var wrap = document.getElementById('sup-contacts');
    var rows = wrap.querySelectorAll('.sup-contact');
    rows.forEach(function(r,i){
      r.querySelector('.sup-c-title').textContent = 'Contact ' + (i+1);
      r.querySelector('.sup-c-remove').style.visibility = rows.length > 1 ? 'visible' : 'hidden';
    });
  }
  // seed the first contact once the DOM is ready
  if(document.readyState !== 'loading') addSupContact();
  else document.addEventListener('DOMContentLoaded', addSupContact);
})();
</script>
