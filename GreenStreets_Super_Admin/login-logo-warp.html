<style>
/* ── logo warp canvas ───────────────────────────────────────────── */
#warpStage{display:flex;align-items:center;justify-content:center;margin:0 auto}
#warpCanvas{display:block;background:transparent}
#warpFallback{color:#fff;font:600 13px Inter,sans-serif;opacity:.7;text-align:center;padding:20px}

/* ── control widget ─────────────────────────────────────────────── */
#wpanel{position:fixed;top:14px;right:14px;width:322px;max-height:calc(100vh - 28px);
  display:flex;flex-direction:column;z-index:9998;
  background:rgba(14,26,22,.82);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);color:#eaf5ef;
  font:400 12px/1.4 Inter,system-ui,sans-serif}
#wpanel.collapsed .wp-body{display:none}
#wpanel.collapsed{width:auto}
.wp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,.09);cursor:default;flex:0 0 auto}
.wp-head b{font-size:12px;font-weight:600;letter-spacing:.2px;flex:1}
.wp-head .wp-fps{font-size:10px;opacity:.5;font-variant-numeric:tabular-nums}
.wp-x{background:none;border:1px solid rgba(255,255,255,.18);color:inherit;border-radius:6px;
  width:22px;height:22px;line-height:1;cursor:pointer;font-size:13px;padding:0;outline:none}
.wp-x:hover{background:rgba(255,255,255,.1)}
.wp-body{overflow:auto;padding:4px 0 10px;flex:1 1 auto;scrollbar-width:thin}
.wp-body::-webkit-scrollbar{width:8px}
.wp-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
.wp-grp{border-bottom:1px solid rgba(255,255,255,.06)}
.wp-grp>summary{list-style:none;cursor:pointer;padding:8px 12px;font-weight:600;font-size:11px;
  letter-spacing:.6px;text-transform:uppercase;color:#8fe3b6;display:flex;align-items:center;gap:6px}
.wp-grp>summary::-webkit-details-marker{display:none}
.wp-grp>summary::before{content:'▸';font-size:9px;opacity:.7;transition:transform .15s}
.wp-grp[open]>summary::before{transform:rotate(90deg)}
.wp-grp-in{padding:2px 12px 10px}
.wp-row{display:grid;grid-template-columns:1fr 46px;gap:2px 8px;align-items:center;margin:7px 0}
.wp-row label{grid-column:1;font-size:11px;opacity:.85}
.wp-row .wp-val{grid-column:2;text-align:right;font-size:10px;opacity:.6;
  font-variant-numeric:tabular-nums}
.wp-row input[type=range]{grid-column:1/3;width:100%;height:16px;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;outline:none}
.wp-row input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;
  background:rgba(255,255,255,.16)}
.wp-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
  margin-top:-4.5px;border-radius:50%;background:#8fe3b6;border:none;cursor:pointer;
  box-shadow:0 0 0 3px rgba(143,227,182,.16)}
.wp-row input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(143,227,182,.4)}
.wp-crow{display:flex;align-items:center;justify-content:space-between;margin:7px 0;font-size:11px}
.wp-crow input[type=color]{width:34px;height:20px;padding:0;border:1px solid rgba(255,255,255,.2);
  border-radius:5px;background:none;cursor:pointer}
.wp-crow select{background:rgba(255,255,255,.07);color:#eaf5ef;border:1px solid rgba(255,255,255,.16);
  border-radius:6px;padding:3px 6px;font:inherit;font-size:11px;outline:none}
.wp-crow input[type=checkbox]{width:15px;height:15px;accent-color:#8fe3b6;cursor:pointer;margin:0}
.wp-btns{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px 2px}
.wp-btn{flex:1 1 auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  color:#eaf5ef;border-radius:7px;padding:6px 8px;font:600 10.5px Inter,sans-serif;cursor:pointer;
  letter-spacing:.3px;outline:none}
.wp-btn:hover{background:rgba(143,227,182,.18);border-color:rgba(143,227,182,.4)}
.wp-btn.on{background:rgba(143,227,182,.26);border-color:#8fe3b6}
.wp-note{padding:6px 12px 0;font-size:10px;opacity:.45;line-height:1.5}
#wpToggle{position:fixed;top:14px;right:14px;z-index:9997;display:none}
</style>

<!-- ══════════════════ LOGO WARP — WebGL lens shader ══════════════════ -->
<script>
(function(){
'use strict';

/* ────────────────────────────────────────────────────────────────
   PARAMETER SPEC — everything here becomes a slider in the widget
   and (for the `u`-prefixed ones) a live shader uniform.
   ──────────────────────────────────────────────────────────────── */
var SPEC = [
 {g:'Motion (circular)', p:[
   ['orbitR',       'Orbit radius',        0,   .55,  .005, .22],
   ['orbitSpeed',   'Orbit speed',        -3,   3,    .01,  .55],
   ['orbitSquashX', 'Orbit width (ellipse)', .05, 2,  .01,  1],
   ['orbitSquashY', 'Orbit height (ellipse)',.05, 2,  .01,  1],
   ['orbitPhase',   'Orbit start angle',   0,   6.28, .01,  0],
   ['lensSpin',     'Lens self-rotation',  -3,  3,    .01,  0],
   ['pulse',        'Size pulse amount',   0,   .8,   .01,  0],
   ['pulseSpeed',   'Size pulse speed',    0,   6,    .01,  1.4]
 ]},
 {g:'Lens shape', p:[
   ['uSizeX',   'Width',           .04, .9,  .005, .16],
   ['uSizeY',   'Height',          .04, .9,  .005, .16],
   ['uRound',   'Corner round (square)', 0, 1, .01, .45],
   ['uSoft',    'Edge softness',   .002, .6, .002, .18],
   ['uZoom',    'Magnify (bulge)', -.9, 3,   .01,  .35],
   ['uEdge',    'Rim refraction',  -1,  2,   .01,  .35],
   ['uPinch',   'Centre pinch',    -1,  1,   .01,  0]
 ]},
 {g:'Swirl / twist', p:[
   ['uSwirl',     'Swirl angle',    -4, 4,  .01, 0],
   ['uSwirlFall', 'Swirl falloff',  .2, 5,  .01, 1.6],
   ['swirlSpin',  'Swirl animation', -4, 4, .01, 0]
 ]},
 {g:'Ripple', p:[
   ['uRipple',      'Ripple depth',  0, .18, .001, 0],
   ['uRippleFreq',  'Ripple rings',  0, 80,  .5,   22],
   ['uRippleSpeed', 'Ripple speed',  -12, 12, .05, 4]
 ]},
 {g:'Optics', p:[
   ['uDisp',    'Chromatic dispersion', 0, 4,  .01, .5],
   ['uBlur',    'Rim blur',             0, 4,  .01, .3],
   ['uSamples', 'Quality (samples)',    1, 16, 1,   8]
 ]},
 {g:'Glow & rim light', p:[
   ['uGlow',        'Ring glow',      0, 2,   .01, .20],
   ['uRingR',       'Ring radius',    0, 1.1, .01, .92],
   ['uRingW',       'Ring width',     .004, .4, .002, .05],
   ['uRimLight',    'Edge rim light', 0, 2,   .01, .25],
   ['uShimmerFreq', 'Shimmer count',  0, 24,  .5,  6],
   ['uShimmerSpeed','Shimmer speed',  -10, 10, .05, 2],
   ['uShimmerDepth','Shimmer depth',  0, 1,   .01, .5],
   ['uOutline',     'Debug outline',  0, 1,   .01, 0],
   ['uTint',        'Lens tint mix',  0, 1,   .01, 0]
 ]},
 {g:'Logo', p:[
   ['uLogoScale',  'Logo scale',       .3, 1.6, .01, 1],
   ['logoSpin',    'Logo spin speed',  -3, 3,   .01, 0],
   ['logoOrbitR',  'Logo orbit radius', 0, .4,  .005, 0],
   ['logoOrbitSpd','Logo orbit speed', -3, 3,   .01, .5],
   ['stageSize',   'Canvas size (px)', 140, 560, 2, 300]
 ]}
];

var TOGGLES = [
  ['shape',      'Lens shape',        'select', [['0','Circle'],['1','Square']], '0'],
  ['follow',     'Lens follows mouse','check',  null, false],
  ['paused',     'Pause animation',   'check',  null, false]
];
var COLORS = [
  ['ringColor', 'Ring / glow colour', '#8fe3b6'],
  ['tintColor', 'Lens tint colour',   '#8fe3b6']
];

/* Presets are ordered gentlest → wildest.  Rule of thumb for keeping the logo
   readable: the lens should stay SMALL relative to the logo (uSizeX/Y ≈ .12–.22)
   and magnify modestly (uZoom ≲ .5).  Swirl is the most destructive knob — a
   little goes a long way, so it's 0 by default. */
var PRESETS = {
 'Logo only':   {uZoom:0,uEdge:0,uSwirl:0,swirlSpin:0,uRipple:0,uDisp:0,uBlur:0,uGlow:0,uRimLight:0,uSizeX:.04,uSizeY:.04,orbitR:0,pulse:0},
 'Subtle':      {uZoom:.18,uEdge:.15,uSwirl:0,swirlSpin:0,uRipple:0,uDisp:.2,uBlur:.15,uGlow:.1,uRimLight:.15,uSizeX:.14,uSizeY:.14,uSoft:.3,orbitR:.2,orbitSpeed:.3,pulse:0},
 'Glass drop':  {uZoom:.35,uEdge:.35,uSwirl:0,swirlSpin:0,uRipple:0,uDisp:.5,uBlur:.3,uGlow:.2,uRimLight:.25,uSizeX:.16,uSizeY:.16,uSoft:.18,orbitR:.22,orbitSpeed:.55,pulse:0},
 'Magnifier':   {uZoom:1.0,uEdge:.6,uSwirl:0,swirlSpin:0,uRipple:0,uDisp:.8,uBlur:.6,uGlow:.1,uRimLight:.7,uSizeX:.14,uSizeY:.14,uSoft:.05,orbitR:.26,orbitSpeed:.8,pulse:0},
 'Liquid swirl':{uZoom:.3,uEdge:.2,uSwirl:1.2,uSwirlFall:1.4,swirlSpin:.5,uRipple:.015,uDisp:.9,uBlur:.5,uGlow:.15,uRimLight:.2,uSizeX:.2,uSizeY:.2,uSoft:.3,orbitR:.2,orbitSpeed:.35,pulse:0},
 'Ripple ring': {uZoom:.12,uEdge:.1,uSwirl:0,swirlSpin:0,uRipple:.035,uRippleFreq:30,uRippleSpeed:5,uDisp:.35,uBlur:.2,uGlow:.4,uRingR:.8,uRingW:.05,uSizeX:.24,uSizeY:.24,uSoft:.4,orbitR:.14,orbitSpeed:.9,pulse:0},
 'Chaos':       {uZoom:1.2,uEdge:1.5,uSwirl:3.2,uSwirlFall:.6,swirlSpin:2.5,uRipple:.09,uRippleFreq:48,uRippleSpeed:8,uDisp:3,uBlur:2,uGlow:.9,uSizeX:.35,uSizeY:.28,uSoft:.2,orbitR:.3,orbitSpeed:1.8,pulse:.4}
};

/* ── state ── */
var P = {};
SPEC.forEach(function(g){ g.p.forEach(function(r){ P[r[0]] = r[5]; }); });
TOGGLES.forEach(function(t){ P[t[0]] = t[4]; });
COLORS.forEach(function(c){ P[c[0]] = c[2]; });
var DEFAULTS = JSON.parse(JSON.stringify(P));

var LS = 'gs-logo-warp-v2';
try{ var saved = JSON.parse(localStorage.getItem(LS)||'null');
     if(saved) Object.keys(saved).forEach(function(k){ if(k in P) P[k]=saved[k]; }); }catch(e){}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(P)); }catch(e){} }

/* ════════════════════════ WebGL ════════════════════════ */
var cv  = document.getElementById('warpCanvas');
var gl  = cv.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:true})
       || cv.getContext('experimental-webgl',{alpha:true,premultipliedAlpha:true});

if(!gl){ cv.hidden = true; document.getElementById('warpFallback').hidden = false; return; }

var VERT = 'attribute vec2 position;varying vec2 vUv;'+
  'void main(){ vUv = position*0.5+0.5; gl_Position = vec4(position,0.0,1.0); }';

var FRAG = [
'precision highp float;',
'varying vec2 vUv;',
'uniform sampler2D uTex;',
'uniform float uAspect,uTime;',
'uniform vec2  uCenter,uLogoOff;',
'uniform float uSizeX,uSizeY,uShape,uRound,uSoft,uRotation;',
'uniform float uZoom,uEdge,uPinch;',
'uniform float uSwirl,uSwirlFall;',
'uniform float uRipple,uRippleFreq,uRippleSpeed;',
'uniform float uDisp,uBlur;',
'uniform int   uSamples;',
'uniform float uGlow,uRingR,uRingW,uRimLight;',
'uniform float uShimmerFreq,uShimmerSpeed,uShimmerDepth;',
'uniform float uOutline,uTint;',
'uniform float uLogoScale,uLogoSpin;',
'uniform vec3  uRingColor,uTintColor;',

'vec2 rot(vec2 p,float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c)*p; }',
'float sdRoundBox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r;',
'  return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r; }',

// screen uv → logo-texture uv (logo scale / spin / own circular orbit)
'vec2 logoUv(vec2 uv){',
'  vec2 c=(uv-0.5)*vec2(uAspect,1.0);',
'  c -= uLogoOff;',
'  c  = rot(c,-uLogoSpin);',
'  c /= max(uLogoScale,0.01);',
'  return vec2(c.x/uAspect,c.y)+0.5;',
'}',
'vec4 T(vec2 uv){ vec2 t=logoUv(uv);',
'  if(t.x<0.0||t.x>1.0||t.y<0.0||t.y>1.0) return vec4(0.0);',
'  return texture2D(uTex,t); }',
// q is an offset in aspect-corrected space, relative to the lens centre
'vec4 S(vec2 q){ return T(uCenter + vec2(q.x/uAspect,q.y)); }',

'void main(){',
'  vec2 p  = (vUv-uCenter)*vec2(uAspect,1.0);',
'  vec2 pr = rot(p,-uRotation);',

// normalised distance: 0 at lens centre, 1 at lens edge
'  float nd;',
'  if(uShape<0.5) nd = length(pr/vec2(uSizeX,uSizeY));',
'  else { float m=min(uSizeX,uSizeY);',
'         nd = 1.0 + sdRoundBox(pr,vec2(uSizeX,uSizeY),uRound*m)/m; }',
'  float rr   = clamp(nd,0.0,1.0);',
'  float mask = 1.0 - smoothstep(1.0-uSoft,1.0,nd);',

// ── the warp itself: bend the sampling coordinate ──
'  vec2  q = pr;',
'  float k = 1.0-rr*rr;',              // 1 at centre → 0 at rim
'  q *= 1.0/(1.0+uZoom*k);',           // magnify the middle
'  q *= 1.0+uEdge*pow(rr,4.0);',       // refract hard at the rim
'  q *= 1.0-uPinch*k;',                // optional centre pinch
'  q  = rot(q, uSwirl*pow(clamp(1.0-rr,0.0,1.0),max(uSwirlFall,0.001)));',
'  float len = length(q)+1e-5;',
'  q += (q/len)*uRipple*sin(rr*uRippleFreq-uTime*uRippleSpeed)*(1.0-rr);',
'  q  = rot(q,uRotation);',

// ── sample: multi-tap blur + per-channel dispersion ──
'  vec4 acc=vec4(0.0); float w=0.0;',
'  for(int i=0;i<16;i++){',
'    if(i>=uSamples) break;',
'    float fi=float(i)/16.0;',
'    vec2 off=vec2(cos(fi*44.0),sin(fi*44.0))*uBlur*rr*rr*0.014*fi;',
'    vec2 b=q+off;',
'    float d=uDisp*rr*rr*0.05;',
'    vec4 g=S(b);',
'    acc += vec4(S(b*(1.0+d)).r, g.g, S(b*(1.0-d)).b, g.a);',
'    w += 1.0;',
'  }',
'  vec4 lens = acc/max(w,1.0);',

'  vec4 base = T(vUv);',
'  vec4 col  = mix(base,lens,mask);',
'  col.rgb   = mix(col.rgb, col.rgb*uTintColor, uTint*mask);',

// ── additive ring glow + rim light ──
'  float shim = mix(1.0, sin(atan(pr.y,pr.x)*uShimmerFreq+uTime*uShimmerSpeed)*0.5+0.5, uShimmerDepth);',
'  float ring = exp(-pow((rr-uRingR)/max(uRingW,0.001),2.0))*uGlow*shim;',
'  float rim  = exp(-pow((nd-1.0)/max(uRingW,0.001),2.0))*uRimLight;',
'  float ol   = exp(-pow((nd-1.0)/0.015,2.0))*uOutline;',
'  float addA = clamp(ring+rim+ol,0.0,1.0);',
'  col.rgb += uRingColor*(ring+rim) + vec3(ol);',
'  col.a    = clamp(col.a+addA*0.85,0.0,1.0);',

'  gl_FragColor = col;',
'}'].join('\n');

function sh(type,src){
  var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s),src);
  return s;
}
var prog = gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog,'position');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);   // texture is premultiplied

var U = {};
function u(n){ return U[n]!==undefined ? U[n] : (U[n]=gl.getUniformLocation(prog,n)); }

/* ── logo texture (padded so the bulge never clips) ── */
var tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,0]));
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

/* The logo is inlined as a data: URI on purpose.  Opening this file by
   double-click gives it a `file://` origin, and Chrome does NOT treat a
   `file://` image as origin-clean — so `texImage2D` throws a SecurityError
   and the canvas stays blank.  A data: URI is always origin-clean, so the

if(LOGO_SRC.indexOf('data:') !== 0) LOGO_SRC = 'img/Logo-WG.png';

var TEXSIZE = 1024, texReady = false;

function texFail(why){
  console.warn('logo warp: '+why);
  cv.hidden = true;
  var f = document.getElementById('warpFallback');
  f.hidden = false;
  f.firstChild.textContent = 'Logo texture blocked ('+why+') — showing the plain logo.';
}

var img = new Image();
img.onload = function(){
  var c = document.createElement('canvas'); c.width=c.height=TEXSIZE;
  var x = c.getContext('2d');
  // fit the logo into the middle 62% — the rest is transparent padding,
  // so the bulge has room to push pixels outwards without clipping
  var box = TEXSIZE*0.62, s = Math.min(box/img.width, box/img.height);
  var w = img.width*s, h = img.height*s;
  x.drawImage(img,(TEXSIZE-w)/2,(TEXSIZE-h)/2,w,h);
  try{
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
    texReady = true;
  }catch(err){
    texFail(err && err.name ? err.name : 'upload failed');
  }
};
img.onerror = function(){ texFail('image failed to load'); };
img.src = LOGO_SRC;

/* ── sizing ── */
var DPR = Math.min(window.devicePixelRatio||1, 2);
function resize(){
  var s = P.stageSize;
  cv.style.width = s+'px'; cv.style.height = s+'px';
  cv.width  = Math.round(s*DPR);
  cv.height = Math.round(s*DPR);
  gl.viewport(0,0,cv.width,cv.height);
}
resize();

/* ── mouse follow ── */
var mouse = {x:.5,y:.5};
cv.addEventListener('pointermove',function(e){
  var r = cv.getBoundingClientRect();
  mouse.x = (e.clientX-r.left)/r.width;
  mouse.y = 1-(e.clientY-r.top)/r.height;
});

function hex2rgb(h){
  h = h.replace('#','');
  return [parseInt(h.substr(0,2),16)/255,parseInt(h.substr(2,2),16)/255,parseInt(h.substr(4,2),16)/255];
}

/* ── render loop ── */
var t0 = performance.now(), t = 0, last = t0, frames = 0, fpsEl = null;
function frame(now){
  requestAnimationFrame(frame);
  render(now);
}
function render(now){
  var dt = Math.min((now-last)/1000, .05); last = now;
  if(!P.paused) t += dt;

  // ── the circular motion: the lens centre orbits the logo ──
  var a = t*P.orbitSpeed*Math.PI*2 + (+P.orbitPhase);
  var cx, cy;
  if(P.follow){ cx = mouse.x; cy = mouse.y; }
  else {
    cx = .5 + Math.cos(a)*P.orbitR*P.orbitSquashX;
    cy = .5 + Math.sin(a)*P.orbitR*P.orbitSquashY;
  }
  var pulse = 1 + Math.sin(t*P.pulseSpeed*Math.PI*2)*P.pulse;

  var la = t*P.logoOrbitSpd*Math.PI*2;

  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.uniform1i(u('uTex'),0);
  gl.uniform1f(u('uAspect'), cv.width/cv.height);
  gl.uniform1f(u('uTime'),   t);
  gl.uniform2f(u('uCenter'), cx, cy);
  gl.uniform2f(u('uLogoOff'), Math.cos(la)*P.logoOrbitR, Math.sin(la)*P.logoOrbitR);
  gl.uniform1f(u('uSizeX'), P.uSizeX*pulse);
  gl.uniform1f(u('uSizeY'), P.uSizeY*pulse);
  gl.uniform1f(u('uShape'), +P.shape);
  gl.uniform1f(u('uRound'), P.uRound);
  gl.uniform1f(u('uSoft'),  P.uSoft);
  gl.uniform1f(u('uRotation'), t*P.lensSpin);
  gl.uniform1f(u('uZoom'),  P.uZoom);
  gl.uniform1f(u('uEdge'),  P.uEdge);
  gl.uniform1f(u('uPinch'), P.uPinch);
  gl.uniform1f(u('uSwirl'), P.uSwirl + t*P.swirlSpin);
  gl.uniform1f(u('uSwirlFall'), P.uSwirlFall);
  gl.uniform1f(u('uRipple'), P.uRipple);
  gl.uniform1f(u('uRippleFreq'), P.uRippleFreq);
  gl.uniform1f(u('uRippleSpeed'), P.uRippleSpeed);
  gl.uniform1f(u('uDisp'), P.uDisp);
  gl.uniform1f(u('uBlur'), P.uBlur);
  gl.uniform1i(u('uSamples'), Math.max(1,Math.round(P.uSamples)));
  gl.uniform1f(u('uGlow'), P.uGlow);
  gl.uniform1f(u('uRingR'), P.uRingR);
  gl.uniform1f(u('uRingW'), P.uRingW);
  gl.uniform1f(u('uRimLight'), P.uRimLight);
  gl.uniform1f(u('uShimmerFreq'), P.uShimmerFreq);
  gl.uniform1f(u('uShimmerSpeed'), P.uShimmerSpeed);
  gl.uniform1f(u('uShimmerDepth'), P.uShimmerDepth);
  gl.uniform1f(u('uOutline'), P.uOutline);
  gl.uniform1f(u('uTint'), P.uTint);
  gl.uniform1f(u('uLogoScale'), P.uLogoScale);
  gl.uniform1f(u('uLogoSpin'), t*P.logoSpin);
  gl.uniform3fv(u('uRingColor'), hex2rgb(P.ringColor));
  gl.uniform3fv(u('uTintColor'), hex2rgb(P.tintColor));

  gl.clearColor(0,0,0,0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if(texReady) gl.drawArrays(gl.TRIANGLES,0,3);

  frames++;
  if(now-t0 > 500 && fpsEl){ fpsEl.textContent = Math.round(frames/((now-t0)/1000))+' fps'; t0=now; frames=0; }
}
requestAnimationFrame(frame);
window.__warpTick = render;   // manual single-frame render (headless verification)

/* ════════════════════════ control widget ════════════════════════ */
function el(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
var rows = {};

function fmt(v){ var a=Math.abs(v); return a>=100?v.toFixed(0):a>=10?v.toFixed(1):v.toFixed(3).replace(/0+$/,'').replace(/\.$/,''); }

});

var btns2 = el('div','wp-btns');
[['Reset', function(){ P=JSON.parse(JSON.stringify(DEFAULTS)); syncUI(); resize(); save(); }],
 ['Randomise', function(){
    // Half-way between the default and a random value — full-range randomness
    // just produces mush every time and the logo stops being readable.
    SPEC.forEach(function(g){ g.p.forEach(function(r){
      if(r[0]==='stageSize'||r[0]==='uSamples') return;
      var rnd = r[2] + Math.random()*(r[3]-r[2]);
      P[r[0]] = DEFAULTS[r[0]] + (rnd - DEFAULTS[r[0]])*0.5;
    }); });
    syncUI(); save();
 }],
 ['Copy JSON', function(){
    var s = JSON.stringify(P,null,2);
    (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(
      function(){ alert('Settings copied to clipboard.'); },
      function(){ prompt('Copy these settings:', s); });
 }]].forEach(function(d){ var b=el('button','wp-btn',d[0]); b.onclick=d[1]; btns2.appendChild(b); });

  if(t[2]==='select'){
    ctl = document.createElement('select');
    t[3].forEach(function(o){ var op=document.createElement('option'); op.value=o[0]; op.textContent=o[1]; ctl.appendChild(op); });
    ctl.value = P[t[0]];
    ctl.onchange = function(){ P[t[0]] = ctl.value; save(); };
  } else {
    ctl = document.createElement('input'); ctl.type='checkbox'; ctl.checked = !!P[t[0]];
    ctl.onchange = function(){ P[t[0]] = ctl.checked; save(); };
  }
  rows[t[0]] = ctl; r.appendChild(ctl); tgi.appendChild(r);
});
COLORS.forEach(function(c){
  var r = el('div','wp-crow'); r.appendChild(el('span',null,c[1]));
  var ctl = document.createElement('input'); ctl.type='color'; ctl.value = P[c[0]];
  ctl.oninput = function(){ P[c[0]] = ctl.value; save(); };
  rows[c[0]] = ctl; r.appendChild(ctl); tgi.appendChild(r);
});
tg.appendChild(tgi); body.appendChild(tg);

// slider groups
SPEC.forEach(function(g,gi){
  var d = el('details','wp-grp'); d.open = gi < 3;
  d.appendChild(el('summary',null,g.g));
  var inner = el('div','wp-grp-in');
  g.p.forEach(function(r){
    var key=r[0], row = el('div','wp-row');
    row.appendChild(el('label',null,r[1]));
    var val = el('span','wp-val',fmt(P[key])); row.appendChild(val);
    var s = document.createElement('input');
    s.type='range'; s.min=r[2]; s.max=r[3]; s.step=r[4]; s.value=P[key];
    s.oninput = function(){
      P[key] = parseFloat(s.value); val.textContent = fmt(P[key]);
      if(key==='stageSize') resize();
      save();
    };
    rows[key] = {s:s,val:val}; row.appendChild(s); inner.appendChild(row);
  });
  d.appendChild(inner); body.appendChild(d);
});

body.appendChild(el('div','wp-note','The warp is a GLSL fragment shader: the logo is a texture, and every pixel looks it up at a bent coordinate. Press <b>H</b> to hide this panel.'));

document.body.appendChild(panel);

function syncUI(){
  Object.keys(rows).forEach(function(k){
    var r = rows[k];
    if(r && r.s){ r.s.value = P[k]; r.val.textContent = fmt(P[k]); }
    else if(r && r.type==='checkbox'){ r.checked = !!P[k]; }
    else if(r){ r.value = P[k]; }
  });
}
syncUI();

var toggleBtn = document.getElementById('wpToggle');
hide.onclick = function(){ panel.style.display='none'; toggleBtn.style.display='block'; };
window.wpShow = function(){ panel.style.display='flex'; toggleBtn.style.display='none'; };
document.addEventListener('keydown', function(e){
  if(e.key==='h'||e.key==='H'){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    (panel.style.display==='none') ? window.wpShow() : hide.onclick();
  }
});
})();
</script>
</body>
</html>
