<div style="background:rgba(94,107,133,.04);border:1.5px dashed rgba(78,187,129,.35);border-radius:12px;padding:20px;text-align:center;margin-bottom:14px">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(78,187,129,.65)" stroke-width="1.8" style="display:block;margin:0 auto 10px"><use href="#gsi-9"/></svg>
  <div style="font-size:13px;font-weight:600;color:var(--tw);margin-bottom:4px">Drag &amp; drop files here</div>
  <div style="font-size:11px;color:var(--tw3);margin-bottom:14px">JPG images, PDFs, .doc / .docx and .xls / .xlsx — up to 25 MB each</div>
  <label style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 16px;background:var(--gs);color:var(--tw);border-radius:7px;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;border:none">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><use href="#gsi-7"/></svg>Choose files
    <input type="file" style="display:none" multiple onchange="docsHandleUpload(this.files)">
  </label>
</div>
<!-- Docs toolbar: search + filter + view toggle -->
<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
  <div class="search-wrap" style="flex:1;min-width:170px;max-width:260px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position:absolute;left:10px;top:50%;transform:translateY(-50%)"><use href="#gsi-2"/></svg><input class="fi fi-search" id="docs-search" placeholder="Search documents, components…" oninput="docsApplyFilters()" style="width:100%;padding-left:30px"></div>
  <select class="pkg-tbl-filter" id="docs-type-filter" onchange="docsApplyFilters()" style="flex-shrink:0"><option value="all">All types</option><option value="Certification">Certification</option><option value="Declaration">Declaration</option><option value="Test Report">Test Report</option></select>
  <!-- View toggle -->
  <div class="docs-view-toggle-wrap" title="Switch view">
    <button class="docs-vbtn active" id="docs-vbtn-list" title="List view" onclick="docsSetView('list')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
    <button class="docs-vbtn" id="docs-vbtn-thumb" title="Thumbnail view" onclick="docsSetView('thumb')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
  </div>
  <div class="docs-thumb-size-wrap" id="docs-thumb-size-wrap" style="display:none">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Width"><polyline points="9 6 3 12 9 18"/><polyline points="15 6 21 12 15 18"/></svg>
    <input type="range" class="docs-thumb-size-slider" min="120" max="440" step="10" value="152" oninput="docsSetThumbSize(this.value)" title="Tile width" aria-label="Tile width">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:6px" title="Height"><polyline points="6 9 12 3 18 9"/><polyline points="6 15 12 21 18 15"/></svg>
    <input type="range" class="docs-thumb-size-slider" min="40" max="240" step="10" value="70" oninput="docsSetThumbVSize(this.value)" title="Tile height" aria-label="Tile height">
  </div>
  <span id="docs-count-lbl" style="font-size:11px;color:var(--tw3);margin-left:auto;white-space:nowrap">6 documents</span>
</div>
<!-- Bulk action bar (hidden until ≥1 row checked) -->
<div class="docs-bulk-bar" id="docs-bulk-bar">
  <span class="docs-bulk-count" id="docs-bulk-count">0 selected</span>
  <button class="docs-bulk-act docs-bulk-dl" onclick="docsBulkDownload()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><use href="#gsi-10"/></svg>Download</button>
  <button class="docs-bulk-act docs-bulk-del" onclick="docsBulkDelete()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><use href="#gsi-16"/></svg>Delete selected</button>
</div>
<!-- List view -->
<div id="docs-list-view" style="overflow-x:auto">
<table class="docs-tbl-new" id="docs-tbl">
<thead><tr>
  <th class="doc-cb-cell"><input type="checkbox" class="doc-cb" id="docs-select-all" title="Select all" onchange="docsSelectAll(this)"></th>
  <th class="doc-sortable" data-sort="name" onclick="docsSort('name')">Document<span class="doc-sort-arrow">↕</span></th>
  <th class="doc-sortable" data-sort="type" onclick="docsSort('type')">Type<span class="doc-sort-arrow">↕</span></th>
  <th class="doc-sortable" data-sort="ref" onclick="docsSort('ref')">Referenced by<span class="doc-sort-arrow">↕</span></th>
  <th class="doc-sortable" data-sort="date" onclick="docsSort('date')">Date<span class="doc-sort-arrow">↕</span></th>
  <th class="doc-sortable" data-sort="size" onclick="docsSort('size')">Size<span class="doc-sort-arrow">↕</span></th>
  <th class="doc-actions-col"></th>
</tr></thead>
<tbody id="docs-tbody-new"></tbody>
</table>
</div>
<!-- Thumbnail view (hidden by default) -->
<div id="docs-thumb-view" class="docs-grid" style="display:none" id="docs-thumb-grid"></div>
<!-- Docs footer: pager + count -->
<div class="docs-foot">
  <span class="docs-foot-count" id="docs-foot-count"></span>
  <button class="dpg-btn" id="dpg-prev" onclick="docsGotoPrev()" disabled><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg> Prev</button>
  <span class="dpg-lbl">Page</span>
  <select class="dpg-jump" id="dpg-jump" onchange="docsGotoPage(+this.value)"><option value="0">1</option></select>
  <span class="dpg-of" id="dpg-of">of 1</span>
  <button class="dpg-btn" id="dpg-next" onclick="docsGotoNext()">Next <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
</div>
